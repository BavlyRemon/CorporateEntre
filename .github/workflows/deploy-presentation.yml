name: Deploy presentation + dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Presentation → site root (/CorporateEntre/) ──
      - name: Install presentation deps
        working-directory: 00_admin/presentation
        run: npm ci

      - name: Build presentation
        working-directory: 00_admin/presentation
        env:
          BASE_PATH: /CorporateEntre/
        run: npm run build

      # ── Dashboard → /CorporateEntre/dashboard/ ──
      - name: Install dashboard deps
        working-directory: 00_admin/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: 00_admin/dashboard
        env:
          BASE_PATH: /CorporateEntre/dashboard/
        run: npm run build

      # ── Combine: presentation at root, dashboard nested ──
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r 00_admin/presentation/dist/* _site/
          mkdir -p _site/dashboard
          cp -r 00_admin/dashboard/dist/* _site/dashboard/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
